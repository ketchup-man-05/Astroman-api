services:
  - type: web
    name: astroman-api
    env: python
    buildCommand: "pip install -r backend/requirements.txt -r backend/requirements-engine.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false  # set in the Render dashboard, never in git
      - key: PYTHON_VERSION
        value: 3.11.0
